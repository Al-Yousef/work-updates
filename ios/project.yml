name: WorkUpdates
options:
  bundleIdPrefix: io.workupdates
  deploymentTarget:
    iOS: '17.0'
packages:
  WorkUpdatesCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '0.4.1'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  WorkUpdates:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WorkUpdatesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.workupdates.iphone
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hyphen
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect privately to your computers to view their work queues and send chat replies.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  WorkUpdatesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WorkUpdates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.workupdates.iphone.uitests
        GENERATE_INFOPLIST_FILE: YES
  WorkUpdatesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WorkUpdates
      - package: WorkUpdatesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.workupdates.iphone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WorkUpdates:
    build:
      targets:
        WorkUpdates: all
        WorkUpdatesUITests: [test]
        WorkUpdatesTests: [test]
    test:
      targets: [WorkUpdatesTests, WorkUpdatesUITests]
      environmentVariables:
        WU_TEST_CODE_FILE: /tmp/work-updates-ios-pairing-code
    run:
      config: Debug
