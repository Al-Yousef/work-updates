name: Bounded idle before and after comparison
on:
  push:
    branches: [diagnose/task-key-before-after]
permissions:
  contents: read
jobs:
  comparison:
    name: Five alternating synthetic comparisons (not qualification)
    runs-on: windows-2025
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ca7e08e63b159b2fc00b675abe00bea713b076be
          path: before
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 39420dad992f1c67f7e237afcf3f3199e9b4e7f7
          path: after
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/idle-before-after.test.cjs
      - run: python -m pip install -r requirements-qa.txt
      - name: Build both exact reviewed sources with the same verified toolchain
        shell: pwsh
        run: |
          foreach($taskSide in @('before','after')){
            Push-Location $taskSide
            try {
              npm ci --no-fund
              if($LASTEXITCODE -ne 0){throw 'Dependency restore failed'}
              node node_modules/electron/install.js
              if($LASTEXITCODE -ne 0){throw 'Electron restore failed'}
              if($taskSide -eq 'before'){
                ./native/windows/bootstrap-toolchain.ps1
                $taskToolName=(Get-Content native/windows/toolchain.json -Raw|ConvertFrom-Json).directory
                $taskToolPath=(Resolve-Path "native/windows/.tools/$taskToolName").Path
              }
              ./native/windows/build.ps1 -OutputDirectory build/candidate -ToolchainDirectory $taskToolPath
            } finally { Pop-Location }
          }
      - name: Retain five alternating fresh fixtures from each source
        shell: pwsh
        run: |
          $taskDriver=$pwd.Path
          New-Item -ItemType Directory artifacts/before-after -Force|Out-Null
          for($taskRound=1;$taskRound -le 5;$taskRound++){
            foreach($taskSide in @('before','after')){
              Push-Location $taskSide
              try {
                $taskResult="$pwd/artifacts/performance/comparison-$taskRound"
                ./scripts/native-performance-audit.ps1 -SecondsPerPhase 30 -ChatCounts @(100,1500) -OutputDirectory $taskResult
                Copy-Item -LiteralPath $taskResult -Destination "$taskDriver/artifacts/before-after/$taskSide-$taskRound" -Recurse
              } finally { Pop-Location }
            }
          }
          node scripts/idle-before-after.cjs artifacts/before-after
          if($LASTEXITCODE -ne 0){throw 'Comparison could not be reproduced'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-before-after-synthetic-json
          path: |
            artifacts/before-after/**/verification.json
            artifacts/before-after/**/metadata.json
            artifacts/before-after/**/*.samples.json
            artifacts/before-after/**/*.workload.json
            artifacts/before-after/**/cleanup.json
            artifacts/before-after/**/performance-ready.json
            artifacts/before-after/**/collector-exit.json
            artifacts/before-after/comparison.json
          if-no-files-found: error
          retention-days: 14
