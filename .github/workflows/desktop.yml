name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: npm ci --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run audit:release
      - run: npm test
        env:
          WORK_UPDATES_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm run test:ui
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build-helper.py
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - run: node scripts/package-audit.cjs --ui
      - run: node scripts/audit-release.cjs --checksums
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/Work-Updates-*.exe
            dist/Work-Updates-*.dmg
            dist/Work-Updates-*.zip
            dist/SHA256-*.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --title "Work Updates $GITHUB_REF_NAME" --notes "Native Windows and macOS development release. Queue tasks, start dedicated Codex chats, review updates, mark Done, and pair desktops privately. Built and tested on clean Windows, Apple Silicon, and Intel Mac runners. Packages are unsigned; see README installation and pairing instructions. No personal chat data is included."
