name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      [
        'ios/**',
        '.github/workflows/iphone.yml',
        'scripts/ios-fixture.cjs',
        'scripts/build-ios-icon.cjs',
      ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: npm ci --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run audit:release
      - run: npm test
        env:
          WORK_UPDATES_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node scripts/diagnostic-bundle-audit.cjs
      - run: node scripts/coordination-contract-audit.cjs --synthetic --output=artifacts/coordination-ci
      - run: node scripts/update-fault-audit.cjs
      - run: node scripts/responsibility-contract-audit.cjs --require-clean
      - run: node scripts/schedule-contract-audit.cjs --require-clean
      - run: node scripts/authorization-contract-audit.cjs --require-clean
      - run: node scripts/commitment-contract-audit.cjs --require-clean
      - run: node scripts/delegation-contract-audit.cjs --require-clean
      - run: npm run test:shutdown
      - run: npm run test:ui
      - run: npm run test:devices
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build-helper.py
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - run: node scripts/package-audit.cjs --ui
      - run: node scripts/audit-release.cjs --checksums
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/Work-Updates-*.exe
            dist/Work-Updates-*.dmg
            dist/Work-Updates-*.zip
            dist/SHA256-*.txt
            artifacts/diagnostic-audit/diagnostic-bundle.json
            artifacts/diagnostic-audit/verification.json
            artifacts/coordination-ci/verification.json
            artifacts/update-faults/verification.json
            artifacts/responsibility-audit/verification.json
            artifacts/schedule-audit/verification.json
            artifacts/authorization-audit/verification.json
            artifacts/commitment-audit/verification.json
            artifacts/delegation-audit/verification.json
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --title "Hyphen $GITHUB_REF_NAME" --notes "Electron compatibility development packages for Windows and macOS. The C++ Windows interface is built separately from native/windows and is not included in these packages. See README for current capability, installation, and validation limits. Packages are unsigned. No personal chat data is included."
