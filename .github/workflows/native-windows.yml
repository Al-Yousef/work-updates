name: Native Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native Windows build and isolated checks
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run audit:release
      - name: Restore digest-pinned LLVM-MinGW
        shell: pwsh
        run: ./native/windows/bootstrap-toolchain.ps1
      - name: Reject missing, changed and stale toolchains
        shell: pwsh
        run: ./native/windows/scripts/build-gates.test.ps1
      - name: Build all native components and run model checks
        shell: pwsh
        run: ./native/windows/build.ps1 -OutputDirectory build/candidate
      - run: python -m pip install -r requirements-qa.txt
      - name: Unified simulated native regression matrix
        run: node scripts/native-qa.cjs --lane=simulated
      - name: Hidden synthetic backend with no collector or writers
        run: node scripts/baseline-runtime-audit.cjs
      - name: Isolated high-contrast composer and theme refresh
        shell: pwsh
        run: ./native/windows/scripts/ux-audit.ps1 -Scales @(96,192) -HighContrast
      - name: Whole-process synthetic performance pilot
        shell: pwsh
        run: |
          ./scripts/owned-process-metrics.test.ps1
          ./scripts/owned-process-observer.test.ps1
          ./scripts/performance-press-proof.test.ps1
          ./scripts/native-performance-audit.ps1 -SecondsPerPhase 6 -SampleIntervalMs 1000
      - name: Packaged update and program rollback with a disposable native app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          ./scripts/update-paths.test.ps1
          $taskReport='artifacts/update-runtime/verification.json'
          Remove-Item -LiteralPath $taskReport -Force -ErrorAction SilentlyContinue
          node scripts/update-runtime-audit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged update runtime audit failed' }
          if (-not (Test-Path -LiteralPath $taskReport)) { throw 'Packaged update report is missing' }
          $taskVerified=Get-Content -LiteralPath $taskReport -Raw | ConvertFrom-Json
          if (-not $taskVerified.passed -or $taskVerified.sourceRevision -ne (git rev-parse HEAD)) { throw 'Packaged update report is stale or failed' }
      - name: Verify native package contents and identity
        shell: pwsh
        run: ./native/windows/scripts/package.ps1
      - name: Synthetic native visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-synthetic-visuals
          path: |
            native/windows/build/candidate/artifacts/*.png
            native/windows/build/candidate/build-verification.json
            native/windows/build/candidate/artifacts/status-verification.json
            native/windows/build/candidate/artifacts/composer-focus-proof-*.json
            native/windows/build/candidate/artifacts/idle-repaint-proof-*.json
            native/windows/build/candidate/artifacts/package-verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-performance-synthetic-metrics
          path: |
            artifacts/performance/**/verification.json
            artifacts/performance/**/metadata.json
            artifacts/performance/**/*.samples.json
            artifacts/performance/**/*.workload.json
            artifacts/performance/**/cleanup.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64-candidate
          path: |
            dist/Hyphen-*-Windows-x64-Native.zip
            dist/Hyphen-*-Windows-x64-Native.zip.sha256
            native/windows/build/candidate/build-verification.json
            artifacts/update-runtime/verification.json
            native/windows/build/candidate/artifacts/status-*.png
            native/windows/build/candidate/artifacts/status-verification.json
            native/windows/build/candidate/artifacts/ux-high-contrast.png
            native/windows/build/artifacts/ux-audit-*.json
            artifacts/native-qa/*/verification.json
            artifacts/performance/**/verification.json
            artifacts/performance/**/metadata.json
            artifacts/performance/**/*.samples.json
            artifacts/performance/**/*.workload.json
            artifacts/performance/**/cleanup.json
            native/windows/build/candidate/artifacts/picker-observations.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-failure-diagnostics
          path: |
            artifacts/native-qa/**/*.txt
            artifacts/performance/**/metadata.json
            artifacts/performance/**/*.samples.json
            artifacts/performance/**/*.workload.json
            artifacts/performance/**/cleanup.json
            artifacts/performance/**/*.stderr.txt
            artifacts/performance/**/selection-failure.json
            artifacts/baseline-runtime/verification.json
            artifacts/update-runtime/verification.json
            artifacts/update-faults/verification.json
            artifacts/native-qa/*/verification.json
            native/windows/build/candidate/artifacts/picker-observations.jsonl
            native/windows/build/candidate/artifacts/responsiveness-failure.json
            native/windows/build/candidate/artifacts/ux-state.json
          if-no-files-found: ignore
          retention-days: 7
